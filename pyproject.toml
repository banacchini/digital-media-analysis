[project]
name = "rentfriends"
version = "0.1.0"
description = "Analysis of parameters influencing the decision to share a flat, based on RentFriends data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastparquet>=2026.9.0",
    "gpboost>=1.8.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "papermill>=2.7.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rentfriends"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
