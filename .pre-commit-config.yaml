repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^logs/ai/
  - repo: local
    hooks:
      - id: block-data-files
        name: block files under data/
        entry: "data/ files must not be committed (see data/README.md)"
        language: fail
        files: ^data/
        exclude: ^data/(README\.md|(raw|interim|processed)/\.gitkeep)$
